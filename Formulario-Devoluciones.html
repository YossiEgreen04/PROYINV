
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Devoluciones</title>
</head>
<body>
    <h1>Registro de Devoluciones - PROYINV</h1>

    <form>
        <label>Codigo del producto:</label>
        <input type="text" required>

        <label>Cantidad devuelta:</label>
        <input type="number" min="1" required>

        <label>Motivo de devolucion:</label>
        <textarea required></textarea>

        <button type="submit">
            Registrar devolucion
        </button>
    </form>
</body>
</html>
